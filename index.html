<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Two Player Game</title>
<style>
body {
  margin: 0;
  background: linear-gradient(to bottom, #cce7f0, #fdf6e3);
  overflow: hidden;
  font-family: "Segoe UI", sans-serif;
}
canvas { display: block; }
#hud {
  position: absolute; top: 10px; left: 10px;
  background: rgba(255,255,255,0.6);
  padding: 12px 16px; border-radius: 12px;
  color: #2c3e50; font-size: 16px;
}
#controls {
  position: absolute; bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 20px;
}
button {
  width: 60px; height: 60px;
  border-radius: 50%; border: none;
  background: #3b82f6; color: white; font-size: 20px;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <h3>🎮 Two Player Game</h3>
  <p>Player1 Score: <span id="score1">0</span></p>
  <p>Player2 Score: <span id="score2">0</span></p>
</div>
<div id="controls">
  <button id="up">⬆️</button>
  <button id="left">⬅️</button>
  <button id="down">⬇️</button>
  <button id="right">➡️</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener("resize",resize);

const player1={x:100,y:200,size:40,speed:7,color:"#22c55e"};
const player2={x:400,y:200,size:90,speed:7,color:"#3b82f6"};

const items=[];for(let i=0;i<30;i++){items.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,size:20});}
let score1=0,score2=0;

function collide(p,it){return(p.x<it.x+it.size&&p.x+p.size>it.x&&p.y<it.y+it.size&&p.y+p.size>it.y);}

function update(){
  // Player1 moves via touch buttons
  if(keys.up) player1.y-=player1.speed;
  if(keys.down) player1.y+=player1.speed;
  if(keys.left) player1.x-=player1.speed;
  if(keys.right) player1.x+=player1.speed;

  // Player2 auto moves (demo AI)
  player2.x+=Math.sin(Date.now()/500)*2;
  player2.y+=Math.cos(Date.now()/500)*2;

  [player1,player2].forEach(p=>{
    p.x=Math.max(0,Math.min(canvas.width-p.size,p.x));
    p.y=Math.max(0,Math.min(canvas.height-p.size,p.y));
  });

  items.forEach(it=>{
    if(collide(player1,it)){score1+=10;document.getElementById("score1").innerText=score1;it.x=Math.random()*canvas.width;it.y=Math.random()*canvas.height;}
    if(collide(player2,it)){score2+=10;document.getElementById("score2").innerText=score2;it.x=Math.random()*canvas.width;it.y=Math.random()*canvas.height;}
  });
}

function draw(){
  ctx.fillStyle="#0f172a";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle=player1.color;ctx.fillRect(player1.x,player1.y,player1.size,player1.size);
  ctx.fillStyle=player2.color;ctx.fillRect(player2.x,player2.y,player2.size,player2.size);
  ctx.fillStyle="#facc15";items.forEach(it=>{ctx.beginPath();ctx.arc(it.x,it.y,it.size,0,Math.PI*2);ctx.fill();});
}

function loop(){update();draw();requestAnimationFrame(loop);}loop();

// Touch controls
const keys={up:false,down:false,left:false,right:false};
function bind(id,key){const btn=document.getElementById(id);btn.addEventListener("touchstart",()=>keys[key]=true);btn.addEventListener("touchend",()=>keys[key]=false);}
bind("up","up");bind("down","down");bind("left","left");bind("right","right");
</script>
</body>
</html>
